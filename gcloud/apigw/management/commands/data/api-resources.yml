  /plugin-gateway/categories/:
    get:
      operationId: plugin_gateway_get_categories
      description: 查询插件分类
      tags:
      - 限制接口
      responses:
        '200':
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: 分类 ID
                    name:
                      type: string
                      description: 分类名称
              result:
                type: boolean
                description: true/false 操作是否成功
              message:
                type: string
                description: result=false 时错误信息
              trace_id:
                type: string
                description: open telemetry trace_id
          description: ''
      x-bk-apigateway-resource:
        isPublic: false
        allowApplyPermission: false
        matchSubpath: false
        backend:
          type: HTTP
          method: get
          path: /{env.api_sub_path}apigw/plugin-gateway/categories/
          matchSubpath: false
          timeout: 0
          upstreams: {}
          transformHeaders: {}
        authConfig:
          userVerifiedRequired: false
          appVerifiedRequired: true
          resourcePermissionRequired: true
        disabledStages: []
  /plugin-gateway/plugins/:
    get:
      operationId: plugin_gateway_get_plugin_list
      description: 查询插件列表
      tags:
      - 限制接口
      responses:
        '200':
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  total:
                    type: integer
                    description: 插件总数
                  apis:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: 插件 ID
                        name:
                          type: string
                          description: 插件名称
                        plugin_source:
                          type: string
                          description: 插件来源
                        plugin_code:
                          type: string
                          description: 插件代码
                        group:
                          type: string
                          description: 插件分组
                        wrapper_version:
                          type: string
                          description: 统一协议版本
                        default_version:
                          type: string
                          description: 默认插件版本
                        latest_version:
                          type: string
                          description: 最新插件版本
                        versions:
                          type: array
                          items:
                            type: string
                          description: 可选版本列表
                        category:
                          type: string
                          description: 插件分类 ID
                        category_name:
                          type: string
                          description: 插件分类展示名
                        description:
                          type: string
                          description: 插件描述
                        meta_url_template:
                          type: string
                          description: 查询插件详情的 URL 模板
              result:
                type: boolean
                description: true/false 操作是否成功
              message:
                type: string
                description: result=false 时错误信息
              error_type:
                type: string
                description: 失败类型
              trace_id:
                type: string
                description: open telemetry trace_id
          description: ''
      x-bk-apigateway-resource:
        isPublic: false
        allowApplyPermission: false
        matchSubpath: false
        backend:
          type: HTTP
          method: get
          path: /{env.api_sub_path}apigw/plugin-gateway/plugins/
          matchSubpath: false
          timeout: 0
          upstreams: {}
          transformHeaders: {}
        authConfig:
          userVerifiedRequired: false
          appVerifiedRequired: true
          resourcePermissionRequired: true
        disabledStages: []
  /plugin-gateway/plugins/{plugin_id}/:
    get:
      operationId: plugin_gateway_get_plugin_detail
      description: 查询插件详情
      tags:
      - 限制接口
      responses:
        '200':
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  id:
                    type: string
                    description: 插件 ID
                  name:
                    type: string
                    description: 插件名称
                  plugin_source:
                    type: string
                    description: 插件来源
                  plugin_code:
                    type: string
                    description: 插件代码
                  plugin_version:
                    type: string
                    description: 当前返回的插件版本
                  version:
                    type: string
                    description: uniform_api 运行壳版本
                  wrapper_version:
                    type: string
                    description: 统一协议版本
                  description:
                    type: string
                    description: 插件描述
                  desc:
                    type: string
                    description: uniform_api 兼容插件描述
                  url:
                    type: string
                    description: 创建执行记录的 URL
                  methods:
                    type: array
                    items:
                      type: string
                    description: 可调用方法
                  inputs:
                    type: array
                    items:
                      type: object
                    description: 输入 schema 列表
                  forms:
                    type: object
                    description: 原生表单协议，固定包含 input 和 output；每项为表单描述符或 null
                    required:
                    - input
                    - output
                    properties:
                      input:
                        type: object
                        nullable: true
                        description: 输入表单描述符；没有原生输入表单时为 null
                        required:
                        - type
                        - key
                        - data
                        - is_embedded
                        - base
                        properties:
                          type:
                            type: string
                            description: 表单类型；jsonschema 是消费端支持的可选 provider 扩展
                            enum:
                            - component_js
                            - renderform
                            - jsonschema
                          key:
                            type: string
                          data:
                            oneOf:
                            - type: string
                            - type: object
                          is_embedded:
                            type: boolean
                          base:
                            type: string
                            nullable: true
                      output:
                        type: object
                        nullable: true
                        description: 输出表单描述符；没有原生输出表单时为 null
                        required:
                        - type
                        - key
                        - data
                        - is_embedded
                        - base
                        properties:
                          type:
                            type: string
                            description: 表单类型；jsonschema 是消费端支持的可选 provider 扩展
                            enum:
                            - component_js
                            - renderform
                            - jsonschema
                          key:
                            type: string
                          data:
                            oneOf:
                            - type: string
                            - type: object
                          is_embedded:
                            type: boolean
                          base:
                            type: string
                            nullable: true
                  form_schema:
                    type: object
                    description: 过渡期兼容的完整 JSON 表单 schema，仍可能存在；新接入应读取 forms
                  form_context:
                    type: object
                    description: 可选的 JSON 表单上下文；仅在请求提供 source_key 时返回
                    required:
                    - project
                    - biz_cc_id
                    - site_url
                    - component
                    - variable
                    - template
                    - instance
                    - bk_plugin_api_host
                    properties:
                      project:
                        type: object
                        required:
                        - id
                        - bk_biz_id
                        - from_cmdb
                        properties:
                          id:
                            type: integer
                          bk_biz_id:
                            type: integer
                          from_cmdb:
                            type: boolean
                      biz_cc_id:
                        type: integer
                      site_url:
                        type: string
                      component:
                        type: string
                      variable:
                        type: string
                      template:
                        type: string
                      instance:
                        type: string
                      bk_plugin_api_host:
                        type: object
                        additionalProperties:
                          type: string
                  outputs:
                    type: array
                    items:
                      type: object
                    description: 输出 schema 列表
                  polling:
                    type: object
                    description: 轮询配置
              result:
                type: boolean
                description: true/false 操作是否成功
              message:
                type: string
                description: result=false 时错误信息
              error_type:
                type: string
                description: 失败类型
              trace_id:
                type: string
                description: open telemetry trace_id
          description: ''
      x-bk-apigateway-resource:
        isPublic: false
        allowApplyPermission: false
        matchSubpath: false
        backend:
          type: HTTP
          method: get
          path: /{env.api_sub_path}apigw/plugin-gateway/plugins/{plugin_id}/
          matchSubpath: false
          timeout: 0
          upstreams: {}
          transformHeaders: {}
        authConfig:
          userVerifiedRequired: false
          appVerifiedRequired: true
          resourcePermissionRequired: true
        disabledStages: []
