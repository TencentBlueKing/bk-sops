swagger: '2.0'
basePath: /
info:
  version: '0.1'
  title: API Gateway Resources
  description: ''
schemes:
- http
paths:
  /callback/{token}/:
    post:
      operationId: callback
      description: 节点回调入口
      tags:
      - 限制接口
      x-bk-apigateway-resource:
        isPublic: false
        allowApplyPermission: false
        matchSubpath: false
        backend:
          type: HTTP
          method: post
          path: /{env.callback_sub_path}taskflow/api/v4/nodes/callback/{token}/
          matchSubpath: false
          timeout: 0
          upstreams:
            loadbalance: roundrobin
            hosts:
            - host: http://{env.callback_host}
              weight: 100
          transformHeaders: {}
        authConfig:
          userVerifiedRequired: false
          appVerifiedRequired: false
          resourcePermissionRequired: false
        disabledStages: []
  /create_periodic_task/{template_id}/{bk_biz_id}/:
    post:
      operationId: create_periodic_task
      description: 创建周期任务
      tags:
      - 限制接口
      x-bk-apigateway-resource:
        isPublic: true
        allowApplyPermission: false
        matchSubpath: false
        backend:
          type: HTTP
          method: post
          path: /{env.api_sub_path}apigw/create_periodic_task/{template_id}/{bk_biz_id}/
          matchSubpath: false
          timeout: 0
          upstreams: {}
          transformHeaders: {}
        authConfig:
          userVerifiedRequired: true
        disabledStages: []
  /create_task/{template_id}/{bk_biz_id}/:
    post:
      operationId: create_task
      description: 通过业务流程模板创建任务
      tags:
      - 通用接口
      responses:
        '200':
          schema:
            type: object
            properties:
                  code:
                    type: integer
                    description: 错误码
                  data:
                    type: object
                    properties:
                      task_id:
                        type: integer
                        description: 任务实例ID
                      task_url:
                        type: string
                        description: 任务实例链接
                      pipeline_tree:
                        type: object
                        description: 任务实例树
                    description: result=true 时成功数据，详细信息请见下面说明
                  result:
                    type: boolean
                    description: true/false 操作是否成功
                  message:
                    type: string
                    description: result=false 时错误信息
                  trace_id:
                    type: string
                    description: open telemetry trace_id
          description: ''
      x-bk-apigateway-resource:
        isPublic: true
        allowApplyPermission: true
        matchSubpath: false
        backend:
          type: HTTP
          method: post
          path: /{env.api_sub_path}apigw/create_task/{template_id}/{bk_biz_id}/
          matchSubpath: false
          timeout: 0
          upstreams: {}
          transformHeaders: {}
        authConfig:
          userVerifiedRequired: true
        disabledStages: []
  /create_and_start_task/{template_id}/{bk_biz_id}/:
    post:
      operationId: create_and_start_task
      description: 通过业务流程模板创建并开始执行任务
      tags:
      - 通用接口
      responses:
        '200':
          schema:
            type: object
            properties:
              code:
                type: integer
                description: 错误码
              data:
                type: object
                properties:
                  task_id:
                    type: integer
                    description: 任务实例ID
                  task_url:
                    type: string
                    description: 任务实例链接
                  pipeline_tree:
                    type: object
                    description: 任务实例树
                description: result=true 时成功数据，详细信息请见下面说明
              result:
                type: boolean
                description: true/false 操作是否成功
              message:
                type: string
                description: result=false 时错误信息
              trace_id:
                type: string
                description: open telemetry trace_id
          description: ''
      x-bk-apigateway-resource:
        isPublic: true
        allowApplyPermission: true
        matchSubpath: false
        backend:
          type: HTTP
          method: post
          path: /{env.api_sub_path}apigw/create_and_start_task/{template_id}/{bk_biz_id}/
          matchSubpath: false
          timeout: 0
          upstreams: {}
          transformHeaders: {}
        authConfig:
          userVerifiedRequired: true
        disabledStages: []
  /dispatch_plugin_query/:
    post:
      operationId: dispatch_plugin_query
      description: 插件请求转发
      tags:
      - 限制接口
      x-bk-apigateway-resource:
        isPublic: true
        allowApplyPermission: false
        matchSubpath: false
        backend:
          type: HTTP
          method: post
          path: /{env.api_sub_path}apigw/dispatch_plugin_query/
