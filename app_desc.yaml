specVersion: 3
appVersion: "3.35.12"
app:
  region: default
  bkAppCode: bk_sops
  bkAppName: 标准运维
  bkAppNameEn: Standard OPS
  market:
    category: 运维工具
    introduction: 标准运维是通过一套成熟稳定的任务调度引擎，把在多系统间的工作整合到一个流程，助力运维实现跨系统调度自动化的SaaS应用。
    introductionEn: SOPS is a SaaS application that utilizes a set of mature and stable task scheduling engines to help realize cross-system scheduling automation, and integrates the work among multiple systems into a single process.
    displayOptions:
      width: 1280
      height: 720
      openMode: new_tab
      isMaximized: true
modules:
  - name: default
    isDefault: true
    sourceDir: ./src
    language: Python
    spec:
      addons:
        - name: mysql
        - name: rabbitmq
        - name: redis
        - name: bkrepo
        - name: otel
      configuration:
        env:
          - name: PIP_VERSION
            value: 20.2.3
            description: PIP版本
          - name: BKAPP_FILE_MANAGER_TYPE
            value: job_repo
            description: 文件管理类型
          - name: BKAPP_AUTO_UPDATE_VARIABLE_MODELS
            value: '0'
            description: 是否自动更新变量模型
          - name: BKAPP_AUTO_UPDATE_COMPONENT_MODELS
            value: '0'
            description: 是否自动更新插件模型
          - name: GUNICORN_WORKER_NUM
            value: '1'
            description: GunicornWorker数量
          - name: GUNICORN_THREAD_NUM
            value: '10'
            description: GunicornThread数量
          - name: C_FORCE_ROOT
            value: '1'
            description: celery5 fit
          - name: ENABLE_METRICS
            value: '1'
            description: 是否启动 metrics server
      processes:
        - name: web
          procCommand: bin/start_web.sh
          resQuotaPlan: 4C2G
          replicas: 5
          services:
            - name: web
              protocol: TCP
              exposedType:
                name: bk/http
              targetPort: 5000
              port: 80
            - name: metrics
              protocol: TCP
              port: 5001
              targetPort: 5001
        - name: beat
          procCommand: python manage.py celery beat -l info
          resQuotaPlan: 4C1G
          replicas: 1
        - name: dworker
          procCommand: bash bin/celery_auto_restart.sh -A blueapps.core.celery worker -Q default -n default@%h -P threads -c 20 -l info
          resQuotaPlan: 4C2G
          replicas: 5
      hooks:
        preRelease:
          procCommand: bash bin/pre_release
      svcDiscovery:
        bkSaaS:
          - bkAppCode: bk_iam
          - bkAppCode: bk_user_manage
          - bkAppCode: bk_nodeman
          - bkAppCode: bk_gsekit
          - bkAppCode: bk_sops
          - bkAppCode: bk_sops
            moduleName: callback
          - bkAppCode: bk_sops
            moduleName: api
      observability:
        monitoring:
          metrics:
            - process: web
              serviceName: metrics
              path: /metrics
  - name: callback
    isDefault: false
    sourceDir: ./src
    language: Python
    spec:
      addons:
        - name: mysql
          sharedFromModule: default
        - name: rabbitmq
          sharedFromModule: default
        - name: redis
          sharedFromModule: default
        - name: bkrepo
          sharedFromModule: default
        - name: otel
          sharedFromModule: default
      configuration:
        env:
          - name: PIP_VERSION
            value: 20.2.3
            description: PIP版本
          - name: BKAPP_FILE_MANAGER_TYPE
            value: job_repo
            description: 文件管理类型
          - name: BKAPP_AUTO_UPDATE_VARIABLE_MODELS
            value: '0'
            description: 是否自动更新变量模型
          - name: BKAPP_AUTO_UPDATE_COMPONENT_MODELS
            value: '0'
            description: 是否自动更新插件模型
          - name: GUNICORN_WORKER_NUM
            value: '1'
            description: GunicornWorker数量
          - name: GUNICORN_THREAD_NUM
            value: '10'
            description: GunicornThread数量
          - name: C_FORCE_ROOT
            value: '1'
            description: celery5 fit
          - name: ENABLE_METRICS
            value: '1'
            description: 是否启动 metrics server
      processes:
        - name: web
          procCommand: gunicorn wsgi -w $GUNICORN_WORKER_NUM -b [::]:${PORT:-5000} --access-logfile - --error-logfile - --access-logformat '[%(h)s] %({request_id}i)s %(u)s %(t)s "%(r)s" %(s)s %(D)s %(b)s "%(f)s" "%(a)s"' --max-requests=500 -k gthread --threads $GUNICORN_THREAD_NUM
          resQuotaPlan: 4C5G
          replicas: 5
          services:
            - name: web
              protocol: TCP
              exposedType:
                name: bk/http
              targetPort: 5000
              port: 80
            - name: metrics
              protocol: TCP
              port: 5001
              targetPort: 5001
      svcDiscovery:
        bkSaaS:
          - bkAppCode: bk_iam
          - bkAppCode: bk_user_manage
          - bkAppCode: bk_nodeman
          - bkAppCode: bk_gsekit
          - bkAppCode: bk_sops
          - bkAppCode: bk_sops
            moduleName: callback
          - bkAppCode: bk_sops
            moduleName: api
      observability:
        monitoring:
          metrics:
            - process: web
              serviceName: metrics
              path: /metrics
  - name: pipeline
    isDefault: false
    sourceDir: ./src
    language: Python
    spec:
      addons:
        - name: mysql
          sharedFromModule: default
        - name: rabbitmq
          sharedFromModule: default
        - name: redis
          sharedFromModule: default
        - name: bkrepo
          sharedFromModule: default
        - name: otel
          sharedFromModule: default
      configuration:
        env:
          - name: PIP_VERSION
            value: 20.2.3
            description: PIP版本
          - name: BKAPP_FILE_MANAGER_TYPE
            value: job_repo
            description: 文件管理类型
          - name: DEFAULT_MAX_TASKS_IN_MEMORY
            value: '100000'
            description: celery exporter 存储任务最大值
          - name: CELERY_EXPORTER_QUEUE
            value: default api_task_queue_pipeline_priority api_task_queue_service_schedule_priority periodic_task_queue_pipeline_priority periodic_task_queue_service_schedule_priority pipeline pipeline_additional_task pipeline_additional_task_priority pipeline_priority pipeline_statistics_priority service_schedule service_schedule_priority task_prepare_api er_execute er_execute_api er_execute_periodic_task er_schedule er_schedule_api er_schedule_periodic_task node_auto_retry timeout_node_execute timeout_nodes_record task_callback
            description: celery exporter 队列
          - name: BKAPP_AUTO_UPDATE_VARIABLE_MODELS
            value: '0'
            description: 是否自动更新变量模型
          - name: BKAPP_AUTO_UPDATE_COMPONENT_MODELS
            value: '0'
            description: 是否自动更新插件模型
          - name: CELERY_EXPORTER_PORT
            value: '5000'
            description: celery-exporter 监听端口
          - name: CELERY_RESTART_INTERVAL
            value: '604800'
            description: Celery worker 基础重启间隔（秒），7天
          - name: C_FORCE_ROOT
            value: '1'
            description: celery5 fit
          - name: ENABLE_METRICS
            value: '1'
            description: 是否启动 metrics server
      processes:
        - name: v1-engine
          procCommand: bash bin/celery_auto_restart.sh -A blueapps.core.celery worker -P threads -Q api_task_queue_pipeline_priority,api_task_queue_service_schedule_priority,periodic_task_queue_pipeline_priority,periodic_task_queue_service_schedule_priority,pipeline,pipeline_priority,service_schedule,service_schedule_priority -n v1_engine@%h -c 100 -l info
          resQuotaPlan: 4C1G
          replicas: 2
        - name: api-er-e
          procCommand: bash bin/celery_auto_restart.sh -A blueapps.core.celery worker -P threads -Q er_execute_api -n api_er_e_worker@%h -c 100 -l info
          resQuotaPlan: 4C1G
          replicas: 4
        - name: api-er-s
          procCommand: bash bin/celery_auto_restart.sh -A blueapps.core.celery worker -P threads -Q er_schedule_api -n api_er_s_worker@%h -c 100 -l info
          resQuotaPlan: 4C1G
          replicas: 4
        - name: api-task
          procCommand: bash bin/celery_auto_restart.sh -A blueapps.core.celery worker -P threads -Q task_prepare_api -n api_task_worker@%h -c 50 -l info
          resQuotaPlan: 4C1G
          replicas: 2
        - name: cworker
          procCommand: bash bin/celery_auto_restart.sh -A blueapps.core.celery worker -P threads -Q pipeline_additional_task,pipeline_additional_task_priority,node_auto_retry,timeout_node_execute,timeout_nodes_record,task_callback -n common_worker@%h -c 6 -l info
          resQuotaPlan: 4C1G
          replicas: 2
        - name: er-e
          procCommand: bash bin/celery_auto_restart.sh -A blueapps.core.celery worker -P threads -Q er_execute -n er_e_worker@%h -c 100 -l info
          resQuotaPlan: 4C2G
          replicas: 2
        - name: er-s
          procCommand: bash bin/celery_auto_restart.sh -A blueapps.core.celery worker -P threads -Q er_schedule -n er_s_worker@%h -c 100 -l info
          resQuotaPlan: 4C2G
          replicas: 2
        - name: peri-er-e
          procCommand: bash bin/celery_auto_restart.sh -A blueapps.core.celery worker -P threads -Q er_execute_periodic_task -n peri_er_e_worker@%h -c 100 -l info
          resQuotaPlan: 4C1G
          replicas: 2
        - name: peri-er-s
          procCommand: bash bin/celery_auto_restart.sh -A blueapps.core.celery worker -P threads -Q er_schedule_periodic_task -n peri_er_s_worker@%h -c 100 -l info
          resQuotaPlan: 4C1G
          replicas: 2
        - name: stats-worker
          procCommand: bash bin/celery_auto_restart.sh -A blueapps.core.celery worker -P threads -Q pipeline_statistics_priority -n default@%h -c 100 -l info
          resQuotaPlan: 4C1G
          replicas: 2
        - name: cleaner
          procCommand: bash bin/celery_auto_restart.sh -A blueapps.core.celery worker -P threads -Q task_data_clean -n cleaner_worker@%h -c 3 -l info
          resQuotaPlan: 4C1G
          replicas: 2
        - name: web
          procCommand: bash bin/exporter_auto_restart.sh --broker amqp://$RABBITMQ_USER:$RABBITMQ_PASSWORD@$RABBITMQ_HOST:$RABBITMQ_PORT/$RABBITMQ_VHOST --addr 0.0.0.0:$CELERY_EXPORTER_PORT --queue-list $CELERY_EXPORTER_QUEUE
          resQuotaPlan: 4C1G
          replicas: 1
          services:
            - name: web
              protocol: TCP
              exposedType:
                name: bk/http
              targetPort: 5000
              port: 80
            - name: metrics
              protocol: TCP
              port: 5001
              targetPort: 5001
        - name: node-timeout
          procCommand: python manage.py node_timeout_process
          resQuotaPlan: 4C1G
          replicas: 1
        - name: ai-notify
          procCommand: bash bin/celery_auto_restart.sh -A blueapps.core.celery worker -P threads -Q ai_notify -n ai_notify_worker@%h -c 35 -l info
          resQuotaPlan: 4C1G
          replicas: 2
      svcDiscovery:
        bkSaaS:
          - bkAppCode: bk_iam
          - bkAppCode: bk_user_manage
          - bkAppCode: bk_nodeman
          - bkAppCode: bk_gsekit
          - bkAppCode: bk_sops
          - bkAppCode: bk_sops
            moduleName: callback
          - bkAppCode: bk_sops
            moduleName: api
      observability:
        monitoring:
          metrics:
            - process: web
              serviceName: metrics
              path: /metrics
  - name: api
    isDefault: false
    sourceDir: ./src
    language: Python
    spec:
      addons:
        - name: mysql
          sharedFromModule: default
        - name: rabbitmq
          sharedFromModule: default
        - name: redis
          sharedFromModule: default
        - name: bkrepo
          sharedFromModule: default
        - name: otel
          sharedFromModule: default
      configuration:
        env:
          - name: PIP_VERSION
            value: 20.2.3
            description: PIP版本
          - name: BKAPP_FILE_MANAGER_TYPE
            value: job_repo
            description: 文件管理类型
          - name: BKAPP_AUTO_UPDATE_VARIABLE_MODELS
            value: '0'
            description: 是否自动更新变量模型
          - name: BKAPP_AUTO_UPDATE_COMPONENT_MODELS
            value: '0'
            description: 是否自动更新插件模型
          - name: GUNICORN_WORKER_NUM
            value: '1'
            description: GunicornWorker数量
          - name: GUNICORN_THREAD_NUM
            value: '10'
            description: GunicornThread数量
          - name: C_FORCE_ROOT
            value: '1'
            description: celery5 fit
          - name: ENABLE_METRICS
            value: '1'
            description: 是否启动 metrics server
      processes:
        - name: web
          procCommand: gunicorn wsgi -w $GUNICORN_WORKER_NUM -b [::]:${PORT:-5000} --access-logfile - --error-logfile - --access-logformat '[%(h)s] %({request_id}i)s %(u)s %(t)s "%(r)s" %(s)s %(D)s %(b)s "%(f)s" "%(a)s"' --max-requests=500 -k gthread --threads $GUNICORN_THREAD_NUM
          resQuotaPlan: 4C2G
          replicas: 5
          services:
            - name: web
              protocol: TCP
              exposedType:
                name: bk/http
              targetPort: 5000
              port: 80
            - name: metrics
              protocol: TCP
              port: 5001
              targetPort: 5001
      svcDiscovery:
        bkSaaS:
          - bkAppCode: bk_iam
          - bkAppCode: bk_user_manage
          - bkAppCode: bk_nodeman
          - bkAppCode: bk_gsekit
          - bkAppCode: bk_sops
          - bkAppCode: bk_sops
            moduleName: callback
          - bkAppCode: bk_sops
            moduleName: api
      observability:
        monitoring:
          metrics:
            - process: web
              serviceName: metrics
              path: /metrics
